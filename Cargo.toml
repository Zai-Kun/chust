[workspace]
resolver = "2"
members = [
    "crates/chust-lib",
    "crates/chust-cli",
    "crates/chust-mobile",
    "crates/chust-wasm"
]

[workspace.dependencies]
chust-lib = { path = "crates/chust-lib" }
thiserror = "2.0.19"
anyhow = "1.0.96"
imageproc = "0.25.0"
enigo = {version = "0.6.1", default-features = false}
xcap = "0.9.8"

ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.13", default-features = false }
ab_glyph = "0.2.29"
