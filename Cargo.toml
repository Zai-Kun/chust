[workspace]
resolver = "2"
members = [
    "crates/chust-lib",
    "crates/chust-cli",
    "crates/chust-mobile",
    "crates/chust-wasm"
]

[workspace.dependencies]
chust-lib = { path = "crates/chust-lib" }
thiserror = "2.0.19"
anyhow = "1.0.96"
clap = { version = "4.5.30", features = ["derive"] }
imageproc = "0.25.0"
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.13", default-features = false }
ab_glyph = "0.2.29"
enigo = "0.3.0"
xcap = "0.4.0"

# Linux Wayland dependencies
wayland-client = "0.31.7"
wayland-protocols = { version = "0.32.5", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.5", features = ["client"] }
nix = { version = "0.29.0", features = ["fs", "mman"], default-features = false }
