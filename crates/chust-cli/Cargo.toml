[package]
name = "chust-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
chust-lib = { workspace = true }
anyhow = { workspace = true }
imageproc = { workspace = true }
ndarray = { workspace = true }
ort = { workspace = true, features = ["download-binaries", "tls-native"] }

enigo = { workspace = true }
xcap = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# wayland-client = "0.31.7"
# wayland-protocols = { version = "0.32.5", features = ["client"] }
# wayland-protocols-wlr = { version = "0.3.5", features = ["client"] }
# nix = { version = "0.29.0", features = ["fs", "mman"], default-features = false }
enigo = { workspace = true, features = ["wayland"], default-features = true }

[features]
default = []
embed_model = ["chust-lib/embed_model"]
